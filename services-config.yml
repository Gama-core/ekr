# EKR Services Configuration
# This file defines deployment parameters for each service in the services/ directory

version: "1.0"

# Global configuration that applies to all services unless overridden
global:
  service_type: "python"
  runtime: "uvicorn"
  python_version: "3.9"
  user: "ekr"
  group: "ekr"
  working_directory: "/opt/ekr/services"
  log_directory: "/var/log/ekr"
  pid_directory: "/var/run/ekr"
  environment_file: "/etc/ekr/environment"
  systemd_directory: "/etc/systemd/system"
  backup_directory: "/opt/ekr/backups"
  health_check_timeout: 30
  startup_timeout: 60
  restart_policy: "on-failure"
  restart_delay: 5

# Service-specific configurations
services:
  database-api:
    name: "EKR Database API"
    description: "Database API service for EKR"
    port: 8003
    main_file: "main.py"
    health_endpoint: "/health"
    dependencies:
      - "postgresql.service"
    environment_variables:
      DATABASE_URL: "${DATABASE_URL}"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "512M"
      cpu_limit: "1.0"

  llm-query:
    name: "EKR LLM Query Service"
    description: "LLM query service for EKR"
    port: 8002
    main_file: "main.py"
    health_endpoint: "/health"
    environment_variables:
      QWEN_API_KEY: "${QWEN_API_KEY}"
      QWEN_BASE_URL: "${QWEN_BASE_URL}"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "1G"
      cpu_limit: "2.0"

  semantic-retrieval:
    name: "EKR Semantic Retrieval Service"
    description: "Semantic retrieval and RAG service for EKR"
    port: 8001
    main_file: "main.py"
    health_endpoint: "/health"
    dependencies:
      - "ekr-database-api.service"
    environment_variables:
      DATABASE_API_URL: "http://localhost:8003"
      QWEN_API_KEY: "${QWEN_API_KEY}"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "2G"
      cpu_limit: "2.0"

  google-search:
    name: "EKR Google Search Service"
    description: "Google Custom Search service for EKR"
    port: 8004
    main_file: "main.py"
    health_endpoint: "/health"
    environment_variables:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      GOOGLE_CSE_ID: "${GOOGLE_CSE_ID}"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "256M"
      cpu_limit: "0.5"

  elastic-search:
    name: "EKR Elasticsearch Service"
    description: "Elasticsearch indexing service for EKR"
    port: 8005
    main_file: "main.py"
    health_endpoint: "/health"
    dependencies:
      - "ekr-database-api.service"
    environment_variables:
      DATABASE_API_URL: "http://localhost:8003"
      ES_HOST_URL: "${ES_HOST_URL}"
      ES_USERNAME: "${ES_USERNAME}"
      ES_PASSWORD: "${ES_PASSWORD}"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "1G"
      cpu_limit: "1.0"

  web-crawl:
    name: "EKR Web Crawl Service"
    description: "Web crawling service for EKR"
    port: 8006
    main_file: "main.py"
    health_endpoint: "/health"
    environment_variables:
      DATABASE_API_URL: "http://localhost:8003"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "512M"
      cpu_limit: "1.0"

  rss-extractor:
    name: "EKR RSS Extractor Service"
    description: "RSS feed extraction service for EKR"
    port: 8007
    main_file: "main.py"
    health_endpoint: "/health"
    environment_variables:
      DATABASE_API_URL: "http://localhost:8003"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "256M"
      cpu_limit: "0.5"

  ocr:
    name: "EKR OCR Service"
    description: "Optical Character Recognition service for EKR"
    port: 8008
    main_file: "main.py"
    health_endpoint: "/health"
    environment_variables:
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "512M"
      cpu_limit: "1.0"

  mindmap:
    name: "EKR Mindmap Service"
    description: "Mindmap generation service for EKR"
    port: 8009
    main_file: "main.py"
    health_endpoint: "/health"
    dependencies:
      - "ekr-database-api.service"
    environment_variables:
      DATABASE_API_URL: "http://localhost:8003"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "256M"
      cpu_limit: "0.5"

  quiz:
    name: "EKR Quiz Service"
    description: "Quiz generation service for EKR"
    port: 8010
    main_file: "main.py"
    health_endpoint: "/health"
    dependencies:
      - "ekr-database-api.service"
    environment_variables:
      DATABASE_API_URL: "http://localhost:8003"
      LOG_LEVEL: "INFO"
    resources:
      memory_limit: "256M"
      cpu_limit: "0.5"

