name: Deploy EKR Services to AlmaLinux

on:
  push:
    branches: [ main, develop ]
    paths: [ 'services/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'services/**' ]
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all services'
        required: false
        default: 'false'
        type: boolean
      target_environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services_to_deploy:
        description: 'Specific services to deploy (comma-separated, leave empty for auto-detection)'
        required: false
        type: string

env:
  ANSIBLE_HOST_KEY_CHECKING: False
  ANSIBLE_STDOUT_CALLBACK: yaml
  DEPLOYMENT_USER: ekr
  PYTHON_VERSION: "3.9"

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changes.outputs.services }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
      all-services: ${{ steps.list-services.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List all services
        id: list-services
        run: |
          services=$(find services -maxdepth 1 -type d -not -path services | sed 's|services/||' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> $GITHUB_OUTPUT
          echo "All services: $services"

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event.inputs.force_deploy_all }}" == "true" ]; then
            services=$(find services -maxdepth 1 -type d -not -path services | sed 's|services/||' | sort | jq -R -s -c 'split("\n")[:-1]')
            echo "services=$services" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Force deploy all services enabled"
          elif [ -n "${{ github.event.inputs.services_to_deploy }}" ]; then
            services=$(echo "${{ github.event.inputs.services_to_deploy }}" | tr ',' '\n' | jq -R -s -c 'split("\n")[:-1]')
            echo "services=$services" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Manual service selection: $services"
          else
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
              head_sha="${{ github.event.pull_request.head.sha }}"
            else
              base_sha="${{ github.event.before }}"
              head_sha="${{ github.sha }}"
            fi
            
            echo "Comparing $base_sha...$head_sha"
            
            changed_files=$(git diff --name-only $base_sha...$head_sha | grep '^services/' || true)
            echo "Changed files:"
            echo "$changed_files"
            
            if [ -z "$changed_files" ]; then
              echo "services=[]" >> $GITHUB_OUTPUT
              echo "has-changes=false" >> $GITHUB_OUTPUT
              echo "No services changed"
            else
              changed_services=$(echo "$changed_files" | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')
              echo "services=$changed_services" >> $GITHUB_OUTPUT
              echo "has-changes=true" >> $GITHUB_OUTPUT
              echo "Changed services: $changed_services"
            fi
          fi

  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Validate services-config.yml
        run: |
          python -c "
          import yaml
          import sys
          import json
          
          # Load and validate YAML
          try:
              with open('services-config.yml', 'r') as f:
                  config = yaml.safe_load(f)
              print('✅ services-config.yml is valid YAML')
          except Exception as e:
              print(f'❌ Invalid YAML: {e}')
              sys.exit(1)
          
          # Validate required sections
          required_sections = ['global', 'services', 'almalinux', 'deployment']
          for section in required_sections:
              if section not in config:
                  print(f'❌ Missing required section: {section}')
                  sys.exit(1)
          
          print('✅ All required sections present')
          
          # Validate services against detected changes
          changed_services = json.loads('${{ needs.detect-changes.outputs.changed-services }}')
          configured_services = list(config['services'].keys())
          
          for service in changed_services:
              if service not in configured_services:
                  print(f'⚠️ Warning: Service {service} not found in configuration')
          
          print('✅ Configuration validation completed')
          "

  deploy-services:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-config]
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.changed-services) }}
      max-parallel: 3
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-core PyYAML

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create Ansible inventory
        run: |
          mkdir -p deployment/inventory
          cat > deployment/inventory/hosts.yml << EOF
          all:
            hosts:
              almalinux-server:
                ansible_host: ${{ secrets.DEPLOY_HOST }}
                ansible_user: ${{ secrets.DEPLOY_USER }}
                ansible_ssh_private_key_file: ~/.ssh/id_rsa
                ansible_python_interpreter: /usr/bin/python3
            vars:
              target_environment: ${{ github.event.inputs.target_environment || 'staging' }}
              deployment_user: ${{ env.DEPLOYMENT_USER }}
              service_name: ${{ matrix.service }}
          EOF

      - name: Run Ansible deployment
        run: |
          cd deployment
          ansible-playbook -i inventory/hosts.yml deploy-service.yml \
            -e "service_name=${{ matrix.service }}" \
            -e "github_ref=${{ github.ref }}" \
            -e "github_sha=${{ github.sha }}" \
            -e "deployment_timestamp=$(date +%Y%m%d_%H%M%S)" \
            -v

      - name: Health check
        run: |
          cd deployment
          ansible-playbook -i inventory/hosts.yml health-check.yml \
            -e "service_name=${{ matrix.service }}" \
            -v

  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-services]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-core PyYAML

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Create Ansible inventory
        run: |
          mkdir -p deployment/inventory
          cat > deployment/inventory/hosts.yml << EOF
          all:
            hosts:
              almalinux-server:
                ansible_host: ${{ secrets.DEPLOY_HOST }}
                ansible_user: ${{ secrets.DEPLOY_USER }}
                ansible_ssh_private_key_file: ~/.ssh/id_rsa
                ansible_python_interpreter: /usr/bin/python3
            vars:
              target_environment: ${{ github.event.inputs.target_environment || 'staging' }}
              deployment_user: ${{ env.DEPLOYMENT_USER }}
          EOF

      - name: System health check
        run: |
          cd deployment
          ansible-playbook -i inventory/hosts.yml system-health-check.yml -v

      - name: Cleanup old deployments
        run: |
          cd deployment
          ansible-playbook -i inventory/hosts.yml cleanup.yml -v

      - name: Send deployment notification
        if: always()
        run: |
          status="${{ needs.deploy-services.result }}"
          services="${{ needs.detect-changes.outputs.changed-services }}"
          
          if [ "$status" == "success" ]; then
            echo "✅ Deployment successful for services: $services"
          else
            echo "❌ Deployment failed for services: $services"
          fi
          
          # Here you could integrate with Slack, Teams, email, etc.
          # Example: curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"Deployment $status for services: $services\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}